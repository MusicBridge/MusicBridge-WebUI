<!DOCTYPE html>
<!--suppress HtmlFormInputWithoutLabel -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MusicBridge Web Client</title>
        
    <link rel="stylesheet" href="styles/constants.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/data.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/overlay.css">

    <script defer src="scripts/constants.js"></script>
    <script defer src="scripts/providers.js"></script>
    <script defer src="scripts/cookieManager.js"></script>
    <script defer src="scripts/uiController.js"></script>
    <script defer src="scripts/musicController.js"></script>
    <script defer src="scripts/main.js"></script>
</head>
<body>
<div class="overlay" id="overlay" style="display: none">
    <div class="window">
        <h2>Please wait...</h2>
        <p>There providers are busy:</p>
        <ul id="busy-provider"></ul>
    </div>
</div>
<div class="root" id="root">
    <header>
        <form id="search-form">
            <label for="search"></label><input type="text" id="search" class="search" placeholder="Search"/>
        </form>
        <ul class="accounts" id="accounts">
            <li>
                <a class="account account-inactive" href="#"><img
                        src="https://developer.valvesoftware.com/w/images/8/8b/Debugempty.png" alt=""
                        title="PLACEHOLDER"></a>
            </li>
            <li>
                <a class="account account-active" href="#"><img
                        src="https://developer.valvesoftware.com/w/images/8/8b/Debugempty.png" alt=""
                        title="PLACEHOLDER"></a>
            </li>
            <li>
                <a class="account account-premium" href="#"><img
                        src="https://developer.valvesoftware.com/w/images/8/8b/Debugempty.png" alt=""
                        title="PLACEHOLDER"></a>
            </li>
        </ul>
        <div class="settings-button">
            <a class="settings button" href="#"><img src="resources/icons/settings.svg" alt=""></a>
        </div>
    </header>
    <main>
        <ul class="search-list" id="search-list">

        </ul>
    </main>
    <div class="data" id="data"
         style="background: linear-gradient(180deg, rgb(32, 32, 32) 80%, rgba(184, 211, 108, 0.5) 100%);">
        <div class="track-header">
            <img class="track-logo" id="track-data-logo"
                 src="https://developer.valvesoftware.com/w/images/8/8b/Debugempty.png" alt="none">
            <div class="text">
                <h1 id="track-data-title">Title</h1>
                <h3 id="track-data-artist-album">Artist (Album)</h3>
            </div>
            <div></div>
            <div class="track-buttons">
                <div>
                    <a href="javascript:void(0)" id="download-track-button"><img
                            class="track-button button" src="resources/icons/download.svg" alt="DWNL" title="Download track"></a>
                    <a target="_blank" rel="noopener noreferrer" href="#" id="open-track-button"><img
                            class="track-button button" src="resources/icons/open-link.svg" alt="OPEN"
                            title="Open track in service"></a>
                </div>
                <div>
                    <a id="search-artist-button"><img
                            class="track-button button" src="resources/icons/artist-search.svg" alt="FIND"
                            title="Find all from artist"></a>
                    <a target="_blank" rel="noopener noreferrer" href="#" id="open-artist-button"><img
                            class="track-button button" src="resources/icons/open-link.svg" alt="OPEN"
                            title="Open artist in service"></a>
                </div>
                <div>
                    <a id="search-album-button"><img
                            class="track-button button" src="resources/icons/music-album.svg" alt="FIND"
                            title="Find all from album"></a>
                    <a target="_blank" rel="noopener noreferrer" href="#" id="open-album-button"><img
                            class="track-button button" src="resources/icons/open-link.svg" alt="OPEN"
                            title="Open album in service"></a>
                </div>
            </div>
        </div>
        <div class="track-info" id="track-data-info">
            <img src="resources/icons/age-restricted.svg" alt="">
            <img src="resources/icons/lyrics-text.svg" alt="">
            <img src="resources/icons/lyrics-lrc.svg" alt="">
        </div>
        <div class="lyrics-container">
            <div class="lyrics-container-header">
                <h2>Lyrics</h2>
                <div class="lyrics-types">
                    <div class="lyrics-type">
                        <input id="lyrics-lrc" type="radio" name="lyrics" value="1" disabled>
                        <label for="lyrics-lrc">LRC</label>
                    </div>
                    <div class="lyrics-type">
                        <input id="lyrics-text" type="radio" name="lyrics" value="2" checked>
                        <label for="lyrics-text">Text</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div class="current-track-logo-container">
            <img class="current-track-logo" id="current-track-logo"
                 src="https://developer.valvesoftware.com/w/images/8/8b/Debugempty.png" alt="none">
            <div class="text">
                <h1 id="current-track-title">Title</h1>
                <h3 id="current-track-artist-album">Artist (Album)</h3>
            </div>
        </div>
        <div></div>
        <audio id="audio"></audio>

        <div class="playslider-container">
            <p id="currentTime">00:00</p>

            <input
                    type="range"
                    id="playback"
                    name="playback"
                    min="0"
                    max="100"
                    value="0"
            />

            <p id="duration">00:00</p>
        </div>

        <div class="current-track-buttons">
            <a class="current-track-button" href="#">
                <img src="resources/icons/open-link.svg" alt="">
            </a>

            <a class="current-track-button playbutton" href="#" id="playBtn">
                <img id="playIcon" src="resources/icons/play.svg" alt="">
            </a>

            <a class="current-track-button" href="#">
                <img src="resources/icons/repeat.svg" alt="">
            </a>
        </div>

        <div></div>

        <div class="current-track-volume">
            <img src="resources/icons/volume-min.svg" alt="">

            <input
                    type="range"
                    id="volume"
                    name="volume"
                    min="0"
                    max="100"
                    value="100"
            />

            <p id="volumeText">100%</p>
        </div>

        <div class="current-track-info">
            <img src="resources/icons/age-restricted.svg" alt="" title="Age restricted">
            <img src="resources/icons/lyrics-text.svg" alt="" title="Text lyrics available">
            <img src="resources/icons/lyrics-lrc.svg" alt="" title="LRC lyrics available">
        </div>
    </footer>
</div>
</body>
</html>
